<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oddly OS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#08080f;
  --glass:rgba(12,12,28,0.93);
  --glass2:rgba(18,18,38,0.88);
  --border:rgba(130,130,220,0.16);
  --border2:rgba(130,130,220,0.28);
  --primary:#6366f1;
  --primary-dim:rgba(99,102,241,0.18);
  --cyan:#22d3ee;
  --cyan-dim:rgba(34,211,238,0.15);
  --text:#dde4ef;
  --muted:#7a849a;
  --green:#10b981;
  --red:#f87171;
  --amber:#fbbf24;
  --tb:48px;
  --r:11px;
  --win-grad:linear-gradient(110deg,#4338ca 0%,#0e7490 100%);
}

/* ── LOGIN ─────────────────────────────────────────── */
#login-screen{position:fixed;inset:0;z-index:9100;display:none;background:#08080f;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;}
#login-screen.visible{display:flex;}
#login-bg-c{position:absolute;inset:0;pointer-events:none;}
.lb{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:18px;padding:38px 34px;width:360px;background:rgba(10,10,26,.94);border:1px solid rgba(130,130,220,.22);border-radius:18px;backdrop-filter:blur(30px);box-shadow:0 32px 90px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.04) inset;}
.lb-logo{font-size:1.45rem;font-weight:900;letter-spacing:.14rem;background:linear-gradient(110deg,#6366f1,#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.lb-time{font-size:.74rem;color:rgba(130,130,220,.45);letter-spacing:.06rem;margin-top:-10px;}
.ug{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%;}
.uc2{display:flex;flex-direction:column;align-items:center;gap:7px;padding:13px 10px;border-radius:12px;cursor:pointer;flex:1;min-width:76px;background:rgba(255,255,255,.04);border:1px solid rgba(130,130,220,.14);transition:all .18s;}
.uc2:hover{background:rgba(99,102,241,.16);border-color:rgba(99,102,241,.34);transform:translateY(-2px);}
.uc2:active{transform:scale(.96);}
.uc2-em{font-size:2.1rem;filter:drop-shadow(0 2px 8px rgba(0,0,0,.55));}
.uc2-n{font-size:.78rem;font-weight:600;color:var(--text);}
.uc2-b{font-size:.6rem;color:var(--muted);}
.lf{display:flex;flex-direction:column;align-items:center;gap:11px;width:100%;}
.lf-av{font-size:3rem;filter:drop-shadow(0 2px 12px rgba(0,0,0,.6));}
.lf-n{font-size:1.05rem;font-weight:700;color:var(--text);}
.lf-r{font-size:.67rem;color:var(--cyan);margin-top:-6px;}
.lf-pw{width:100%;padding:10px 14px;border-radius:9px;background:rgba(0,0,0,.38);border:1px solid rgba(130,130,220,.22);color:var(--text);font-size:.88rem;outline:none;text-align:center;transition:border-color .15s,box-shadow .15s;}
.lf-pw:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.16);}
.lf-err{font-size:.74rem;color:var(--red);min-height:1em;text-align:center;}
.lf-btn{width:100%;padding:10px;border-radius:9px;border:none;cursor:pointer;background:linear-gradient(110deg,#4338ca,#0891b2);color:#fff;font-size:.9rem;font-weight:600;letter-spacing:.04rem;transition:opacity .15s,transform .1s;}
.lf-btn:hover{opacity:.88;}.lf-btn:active{transform:scale(.97);}
.lf-back{background:none;border:none;color:var(--muted);font-size:.73rem;cursor:pointer;transition:color .15s;}
.lf-back:hover{color:var(--text);}

/* ── BOOT ─────────────────────── */
#boot{
  position:fixed;inset:0;background:#000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:9999;font-family:'Courier New',monospace;overflow:hidden;
}
#boot-scanlines{
  position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.25) 2px,rgba(0,0,0,0.25) 4px);
  animation:scanRoll 8s linear infinite;
}
@keyframes scanRoll{to{background-position:0 40px;}}
.boot-logo{
  font-size:3.8rem;font-weight:900;letter-spacing:.55rem;
  background:linear-gradient(110deg,#6366f1,#22d3ee);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  margin-bottom:.3rem;
  animation:logoGlow 2s ease-in-out infinite alternate;
}
@keyframes logoGlow{
  from{filter:drop-shadow(0 0 8px rgba(99,102,241,.4));}
  to{filter:drop-shadow(0 0 22px rgba(34,211,238,.6));}
}
.boot-ver{color:#3d4a5c;font-size:.72rem;letter-spacing:.35rem;margin-bottom:2.6rem;}
.boot-bar-wrap{width:280px;height:3px;background:#111;border-radius:2px;overflow:hidden;margin-bottom:1rem;}
.boot-bar{height:100%;width:0;background:linear-gradient(90deg,#6366f1,#22d3ee);border-radius:2px;transition:width .08s linear;}
.boot-msg{color:#3d5a6a;font-size:.68rem;letter-spacing:.2rem;min-height:1rem;}

/* ── DESKTOP ───────────────────── */
#desktop{
  position:fixed;inset:0;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  display:none;
}
#wallpaper{position:absolute;inset:0;background:var(--bg);}
#stars-canvas{position:absolute;inset:0;pointer-events:none;}

/* ── WINDOWS ──────────────────── */
#win-layer{position:absolute;inset:0 0 var(--tb) 0;overflow:hidden;}
.os-win{
  position:absolute;display:flex;flex-direction:column;
  min-width:240px;min-height:160px;
  background:var(--glass);
  border:1px solid var(--border);
  border-radius:var(--r);
  backdrop-filter:blur(22px) saturate(1.4);
  box-shadow:0 24px 64px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.04) inset;
  animation:winPop .18s cubic-bezier(.34,1.56,.64,1);
  overflow:hidden;
}
@keyframes winPop{from{opacity:0;transform:scale(.93) translateY(8px);}to{opacity:1;transform:none;}}
@keyframes winClose{to{opacity:0;transform:scale(.92) translateY(6px);}}
@keyframes fadeOut{to{opacity:0;}}
.os-win.focused{border-color:var(--border2);box-shadow:0 28px 72px rgba(0,0,0,.65),0 0 0 1px rgba(99,102,241,.22) inset,0 0 32px rgba(99,102,241,.07);}
.os-win.hidden{display:none;}
.os-win.maximized{left:0!important;top:0!important;width:100%!important;height:calc(100% - var(--tb))!important;border-radius:0;}

.win-head{
  display:flex;align-items:center;
  height:36px;padding:0 10px;
  background:var(--win-grad);cursor:grab;flex-shrink:0;
  position:relative;overflow:hidden;
}
.win-head::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.08) 0%,transparent 100%);
  pointer-events:none;
}
.win-head:active{cursor:grabbing;}
.win-ctrls{display:flex;gap:5px;margin-right:8px;}
.wc{width:11px;height:11px;border-radius:50%;border:none;cursor:pointer;transition:opacity .15s,transform .1s;}
.wc:hover{opacity:.8;transform:scale(1.12);}
.wc-close{background:#ef4444;}
.wc-min{background:#f59e0b;}
.wc-max{background:#22c55e;}
.win-title{
  flex:1;text-align:center;font-size:.75rem;font-weight:600;
  color:rgba(255,255,255,.88);letter-spacing:.06rem;pointer-events:none;
}
.win-icon{font-size:.85rem;margin-right:6px;pointer-events:none;}
.win-body{flex:1;overflow:auto;color:var(--text);position:relative;}
.win-resize{position:absolute;right:0;bottom:0;width:14px;height:14px;cursor:se-resize;opacity:.4;}
.win-resize::after{
  content:'';position:absolute;right:3px;bottom:3px;
  width:6px;height:6px;
  border-right:2px solid var(--cyan);border-bottom:2px solid var(--cyan);
}

/* ── DESKTOP ICONS ─────────────── */
#desk-icons{position:absolute;top:20px;left:16px;bottom:58px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;overflow-x:hidden;padding-right:4px;z-index:5;}
#desk-icons::-webkit-scrollbar{width:6px;}
#desk-icons::-webkit-scrollbar-thumb{background:rgba(99,102,241,.5);border-radius:3px;}
#desk-icons::-webkit-scrollbar-track{background:rgba(0,0,0,.2);}
.d-icon{
  width:68px;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:7px 4px;border-radius:9px;cursor:pointer;
  transition:background .15s;user-select:none;flex-shrink:0;
}
.d-icon:hover{background:rgba(99,102,241,.14);}
.d-icon:active{background:rgba(99,102,241,.26);}
.d-icon.selected{background:rgba(99,102,241,.22);outline:1px solid rgba(99,102,241,.5);}
.d-icon .di-em{font-size:2rem;filter:drop-shadow(0 2px 5px rgba(0,0,0,.6));}
.d-icon .di-label{font-size:.62rem;color:var(--text);text-align:center;line-height:1.25;text-shadow:0 1px 4px rgba(0,0,0,.9);word-break:break-word;}

/* ── TASKBAR ───────────────────── */
#taskbar{
  position:absolute;bottom:0;left:0;right:0;height:var(--tb);
  background:rgba(5,5,14,.96);border-top:1px solid var(--border);
  backdrop-filter:blur(24px);display:flex;align-items:center;padding:0 10px;gap:7px;z-index:100;
}
#start-btn{
  width:34px;height:34px;border-radius:8px;border:none;cursor:pointer;
  background:linear-gradient(110deg,#4338ca,#0e7490);font-size:1.1rem;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:transform .12s,opacity .15s;
}
#start-btn:hover{transform:scale(1.07);}#start-btn:active{transform:scale(.94);}
#tb-wins{flex:1;display:flex;gap:5px;overflow:hidden;}
.tb-btn{
  display:flex;align-items:center;gap:5px;padding:0 10px;height:30px;
  border-radius:6px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);
  cursor:pointer;font-size:.72rem;color:var(--muted);transition:all .15s;
  max-width:148px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
.tb-btn:hover{background:rgba(255,255,255,.09);color:var(--text);}
.tb-btn.active{background:rgba(99,102,241,.22);color:var(--primary);border-color:rgba(99,102,241,.28);}
.tb-btn span{pointer-events:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#tb-clock{font-size:.68rem;color:var(--muted);text-align:right;line-height:1.4;flex-shrink:0;cursor:default;font-variant-numeric:tabular-nums;}

/* ── LAUNCHER ──────────────────── */
#launcher{
  position:absolute;bottom:calc(var(--tb) + 6px);left:6px;width:310px;
  background:var(--glass);border:1px solid var(--border2);border-radius:var(--r);
  backdrop-filter:blur(30px);padding:14px;z-index:200;display:none;
  animation:slideUp .18s ease-out;
}
@keyframes slideUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
#launcher h3{font-size:.68rem;color:var(--muted);letter-spacing:.18rem;text-transform:uppercase;margin-bottom:10px;}
#launcher-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.la-item{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 3px;border-radius:7px;cursor:pointer;background:rgba(255,255,255,.03);
  border:1px solid transparent;transition:all .15s;
}
.la-item:hover{background:var(--primary-dim);border-color:rgba(99,102,241,.25);}
.la-item .la-em{font-size:1.45rem;}
.la-item .la-name{font-size:.6rem;color:var(--muted);text-align:center;line-height:1.2;}

/* ── NOTIFICATIONS ─────────────── */
#notif-stack{position:fixed;top:14px;right:14px;display:flex;flex-direction:column;gap:7px;z-index:9500;}
.notif{
  background:var(--glass);border:1px solid var(--border2);border-radius:9px;
  padding:11px 14px;min-width:230px;max-width:300px;
  box-shadow:0 8px 24px rgba(0,0,0,.45);
  animation:notifIn .25s cubic-bezier(.34,1.4,.64,1);
}
@keyframes notifIn{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:none;}}
@keyframes notifOut{from{opacity:1;transform:translateX(0);}to{opacity:0;transform:translateX(16px);}}
.notif-t{font-size:.78rem;font-weight:600;color:var(--text);margin-bottom:2px;}
.notif-b{font-size:.7rem;color:var(--muted);}

/* ── CTX MENU ──────────────────── */
#ctx-menu{
  position:fixed;z-index:9600;background:var(--glass);border:1px solid var(--border2);
  border-radius:8px;padding:4px;min-width:155px;display:none;
  box-shadow:0 12px 36px rgba(0,0,0,.55);animation:fadeQ .1s ease-out;
}
@keyframes fadeQ{from{opacity:0;transform:scale(.97);}to{opacity:1;transform:none;}}
.ctx-i{padding:6px 12px;border-radius:5px;font-size:.77rem;color:var(--text);cursor:pointer;transition:background .1s;}
.ctx-i:hover{background:var(--primary-dim);}
.ctx-sep{height:1px;background:var(--border);margin:3px 0;}

/* ── SCROLLBAR ─────────────────── */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:rgba(0,0,0,.18);}
::-webkit-scrollbar-thumb{background:rgba(99,102,241,.35);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:rgba(99,102,241,.55);}

/* ══════════════════════════════════
   APP STYLES
══════════════════════════════════ */

/* CALCULATOR */
.calc-wrap{padding:14px;display:flex;flex-direction:column;gap:7px;height:100%;}
.calc-disp{
  background:rgba(0,0,0,.32);border:1px solid var(--border);border-radius:8px;
  padding:10px 13px;text-align:right;
}
.calc-expr{font-size:.72rem;color:var(--muted);min-height:15px;}
.calc-val{font-size:2.1rem;font-weight:300;color:var(--text);word-break:break-all;min-height:44px;display:flex;align-items:center;justify-content:flex-end;}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;flex:1;}
.cb{
  border-radius:7px;border:none;cursor:pointer;font-size:.88rem;font-weight:500;
  transition:opacity .12s,transform .1s;color:var(--text);
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.07);
}
.cb:hover{opacity:.82;}.cb:active{transform:scale(.94);}
.cb.op{background:rgba(99,102,241,.18);color:var(--primary);}
.cb.fn{background:rgba(34,211,238,.12);color:var(--cyan);}
.cb.eq{background:var(--primary);color:#fff;grid-column:span 2;}
.cb.cl{background:rgba(248,113,113,.15);color:var(--red);}

/* NOTES */
.notes-wrap{display:flex;flex-direction:column;height:100%;}
.notes-bar{
  padding:7px 10px;background:rgba(0,0,0,.22);border-bottom:1px solid var(--border);
  display:flex;gap:6px;flex-shrink:0;
}
.notes-bar button{
  padding:3px 9px;border-radius:5px;border:none;
  background:rgba(255,255,255,.06);color:var(--muted);font-size:.72rem;cursor:pointer;transition:all .15s;
}
.notes-bar button:hover{background:var(--primary-dim);color:var(--text);}
.notes-ta{
  flex:1;background:transparent;border:none;outline:none;
  color:var(--text);font-size:.87rem;padding:14px 16px;
  resize:none;line-height:1.65;font-family:inherit;
}

/* CLOCK */
.clock-wrap{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;gap:6px;padding:20px;
}
.clock-time{font-size:3.6rem;font-weight:200;color:var(--text);letter-spacing:.06rem;font-variant-numeric:tabular-nums;}
.clock-date{font-size:.88rem;color:var(--muted);}
.clock-tz{font-size:.72rem;color:var(--primary);margin-top:4px;}

/* TERMINAL */
.term-wrap{
  background:#030308;padding:12px;
  font-family:'Courier New',monospace;font-size:.78rem;
  color:#00e87a;height:100%;overflow-y:auto;display:flex;flex-direction:column;
}
.term-out{flex:1;white-space:pre-wrap;}
.t-line{margin-bottom:2px;line-height:1.5;}
.t-line.cmd-in{color:var(--primary);}
.t-line.err{color:var(--red);}
.t-line.sys{color:var(--amber);}
.t-line.hi{color:var(--cyan);}
.term-row{display:flex;align-items:center;gap:6px;margin-top:6px;}
.term-prompt{color:var(--cyan);white-space:nowrap;}
.term-in{flex:1;background:transparent;border:none;outline:none;color:#00e87a;font-family:inherit;font-size:inherit;caret-color:#00e87a;}

/* SETTINGS */
.set-wrap{padding:16px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;height:100%;}
.set-sec{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;padding:12px;}
.set-sec h3{font-size:.68rem;font-weight:700;color:var(--cyan);letter-spacing:.14rem;text-transform:uppercase;margin-bottom:10px;}
.set-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.set-row:last-child{border-bottom:none;}
.set-label{font-size:.8rem;color:var(--text);}
.set-sub{font-size:.68rem;color:var(--muted);margin-top:1px;}
.set-ctrl{display:flex;gap:5px;}
.pill-btn{
  padding:4px 11px;border-radius:20px;border:1px solid var(--border);
  background:transparent;color:var(--muted);font-size:.7rem;cursor:pointer;transition:all .15s;
}
.pill-btn:hover{border-color:var(--primary);color:var(--text);}
.pill-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;}
.api-input-wrap{display:flex;gap:6px;margin-top:4px;}
.api-input-wrap input{
  flex:1;padding:6px 10px;border-radius:6px;
  background:rgba(0,0,0,.3);border:1px solid var(--border);
  color:var(--text);font-size:.78rem;outline:none;font-family:monospace;
}
.api-input-wrap input:focus{border-color:var(--primary);}
.api-input-wrap button{
  padding:6px 12px;border-radius:6px;border:none;
  background:var(--primary);color:#fff;font-size:.78rem;cursor:pointer;
}

/* APP STORE */
.store-wrap{display:flex;flex-direction:column;height:100%;}
.store-top{
  padding:14px 16px 0;
  background:linear-gradient(135deg,rgba(99,102,241,.12),rgba(34,211,238,.08));
  border-bottom:1px solid var(--border);
}
.store-top h1{font-size:1.2rem;font-weight:700;background:linear-gradient(110deg,var(--primary),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.store-top p{font-size:.72rem;color:var(--muted);margin-bottom:10px;}
.store-tabs{display:flex;gap:2px;}
.s-tab{
  padding:8px 14px;font-size:.75rem;color:var(--muted);cursor:pointer;
  border-bottom:2px solid transparent;transition:all .15s;
}
.s-tab:hover{color:var(--text);}
.s-tab.active{color:var(--primary);border-bottom-color:var(--primary);}
.store-body{flex:1;overflow-y:auto;padding:14px;}
.store-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.s-card{
  background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:9px;
  padding:12px;cursor:pointer;transition:all .2s;
}
.s-card:hover{border-color:rgba(99,102,241,.35);background:rgba(99,102,241,.07);}
.s-card-head{display:flex;gap:9px;align-items:center;margin-bottom:7px;}
.s-card-em{font-size:1.9rem;}
.s-card-name{font-size:.82rem;font-weight:600;color:var(--text);}
.s-card-cat{font-size:.67rem;color:var(--cyan);}
.s-card-desc{font-size:.72rem;color:var(--muted);line-height:1.4;margin-bottom:9px;}
.s-card-foot{display:flex;justify-content:space-between;align-items:center;}
.s-card-info{font-size:.67rem;color:var(--muted);}
.get-btn{
  padding:4px 13px;border-radius:18px;border:none;
  background:var(--primary);color:#fff;font-size:.7rem;cursor:pointer;transition:opacity .15s;
}
.get-btn:hover{opacity:.85;}
.get-btn.installed{background:rgba(16,185,129,.15);color:var(--green);border:1px solid rgba(16,185,129,.3);cursor:default;}
.get-btn.open-btn{background:rgba(34,211,238,.15);color:var(--cyan);border:1px solid rgba(34,211,238,.3);}

/* CHAT */
.chat-wrap{display:flex;flex-direction:column;height:100%;}
.chat-key-bar{
  padding:8px 12px;background:rgba(99,102,241,.08);
  border-bottom:1px solid var(--border);display:flex;gap:6px;align-items:center;flex-shrink:0;
}
.chat-key-bar span{font-size:.7rem;color:var(--muted);white-space:nowrap;}
.chat-key-bar input{
  flex:1;padding:5px 9px;border-radius:5px;
  background:rgba(0,0,0,.3);border:1px solid var(--border);
  color:var(--text);font-size:.75rem;outline:none;font-family:monospace;
}
.chat-key-bar input:focus{border-color:var(--primary);}
.chat-key-bar button{padding:5px 10px;border-radius:5px;border:none;background:var(--primary);color:#fff;font-size:.72rem;cursor:pointer;}
.chat-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:9px;}
.c-msg{max-width:82%;padding:9px 13px;border-radius:11px;font-size:.82rem;line-height:1.5;animation:msgPop .18s ease-out;}

.t-opt.wrong{border-color:var(--red)!important;background:rgba(248,113,113,.12)!important;color:var(--red);}
.trivia-info{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);}

/* 2048 */
.p2048-wrap{padding:14px;display:flex;flex-direction:column;gap:10px;align-items:center;height:100%;}

<script>
'use strict';
const escHTML = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');

// Polyfill for roundRect
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    r=Math.min(r,w/2,h/2);
    this.beginPath();this.moveTo(x+r,y);this.lineTo(x+w-r,y);
    this.arcTo(x+w,y,x+w,y+r,r);this.lineTo(x+w,y+h-r);
    this.arcTo(x+w,y+h,x+w-r,y+h,r);this.lineTo(x+r,y+h);
    this.arcTo(x,y+h,x,y+h-r,r);this.lineTo(x,y+r);
    this.arcTo(x,y,x+r,y,r);this.closePath();
  };
}

// ══════════════════════════════════════════════════════
//  AUDIO
// ══════════════════════════════════════════════════════
let _ctx;
function ac(){if(!_ctx)_ctx=new(window.AudioContext||window.webkitAudioContext)();return _ctx;}
function tone(f,d,t='square',v=0.08){
  try{
    const o=ac().createOscillator(),g=ac().createGain();
    o.connect(g);g.connect(ac().destination);
    o.type=t;o.frequency.value=f;
    g.gain.setValueAtTime(v,ac().currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ac().currentTime+d);
    o.start();o.stop(ac().currentTime+d);
  }catch(e){}
}
const sfx={
  click:()=>{tone(880,.05,'sine',.04);},
  open:()=>{tone(440,.05,'sine',.05);setTimeout(()=>tone(660,.08,'sine',.05),50);},
  close:()=>{tone(300,.1,'square',.04);},
  notify:()=>{tone(660,.08,'sine',.06);setTimeout(()=>tone(880,.1,'sine',.05),80);},
  install:()=>{tone(523,.08,'sine',.06);setTimeout(()=>tone(659,.08,'sine',.06),90);setTimeout(()=>tone(784,.15,'sine',.07),180);},
  jump:()=>{tone(350,.04,'square',.06);setTimeout(()=>tone(520,.06,'square',.05),40);},
  shoot:()=>{tone(900,.04,'sawtooth',.04);},
  hit:()=>{tone(150,.12,'sawtooth',.08);},
  coin:()=>{tone(880,.06,'sine',.07);setTimeout(()=>tone(1100,.08,'sine',.06),60);},
  over:()=>{tone(300,.25,'square',.12);setTimeout(()=>tone(220,.35,'square',.12),200);setTimeout(()=>tone(150,.5,'square',.1),420);},
};

const _DEF_USERS={
  root: {pw:'',admin:true, icon:'👑',name:'Root'},
  oddly:{pw:'',admin:false,icon:'🌀',name:'Oddly User'},
};
function loadUsers(){try{const d=localStorage.getItem('oddly_users');if(d)return JSON.parse(d);}catch(e){}return JSON.parse(JSON.stringify(_DEF_USERS));}
function saveUsers(u){try{localStorage.setItem('oddly_users',JSON.stringify(u));}catch(e){}}
function getUserData(n){const u=loadUsers();return u[n||_currentUser]||{icon:'👤',name:n||'?',admin:false};}

let _currentUser=null;
let _lsAnim=null, _lsClk=null;

function showLogin(){
  const scr=document.getElementById('login-screen');
  scr.classList.add('visible');
  // clock
  function lclk(){const el=document.getElementById('lb-time');if(!el)return;const n=new Date();el.textContent=n.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+' · '+n.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'});}
  lclk();_lsClk=setInterval(lclk,1000);
  // login stars
  (function(){
    const c=document.getElementById('login-bg-c'),cx=c.getContext('2d');
    c.width=window.innerWidth;c.height=window.innerHeight;
    let stars=[],run=true;
    for(let i=0;i<160;i++)stars.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.1+.2,s:Math.random()*.3+.04,p:Math.random()*Math.PI*2,a:Math.random()*.8+.25});
    let t=0;function draw(){if(!run)return;requestAnimationFrame(draw);cx.clearRect(0,0,c.width,c.height);t+=.012;
      stars.forEach(s=>{const a=s.a*(.5+.5*Math.sin(t*s.s+s.p));cx.beginPath();cx.arc(s.x,s.y,s.r,0,Math.PI*2);cx.fillStyle=`rgba(185,195,255,${a})`;cx.fill();});}
    _lsAnim={stop(){run=false;}};draw();
  })();
  renderLoginUsers();
  // wire buttons once
  document.getElementById('lf-pw').addEventListener('keydown',e=>{if(e.key==='Enter')attemptLogin();});
  document.getElementById('lf-ok').addEventListener('click',attemptLogin);
  document.getElementById('lf-bk').addEventListener('click',()=>{
    document.getElementById('lb-form').style.display='none';
    document.getElementById('lb-users').style.display='flex';
    document.getElementById('lf-pw').value='';document.getElementById('lf-err').textContent='';
  });
}

function renderLoginUsers(){
  const users=loadUsers(),grid=document.getElementById('lb-users');
  grid.innerHTML='';grid.style.display='flex';
  document.getElementById('lb-form').style.display='none';
  Object.entries(users).forEach(([uname,u])=>{
    const c=document.createElement('div');c.className='uc2';
    c.innerHTML=`<span class="uc2-em">${u.icon}</span><span class="uc2-n">${uname}</span><span class="uc2-b">${u.admin?'Admin':'User'}</span>`;
    c.addEventListener('click',()=>selectLoginUser(uname));
    grid.appendChild(c);
  });
}

function selectLoginUser(uname){
  const users=loadUsers(),u=users[uname];
  document.getElementById('lb-users').style.display='none';
  document.getElementById('lb-form').style.display='flex';
  document.getElementById('lf-av').textContent=u.icon;
  document.getElementById('lf-n').textContent=u.name||uname;
  document.getElementById('lf-r').textContent=u.admin?'Administrator':'User';
  const pw=document.getElementById('lf-pw');
  pw.dataset.user=uname;document.getElementById('lf-ok').dataset.user=uname;
  pw.value='';document.getElementById('lf-err').textContent='';
  if(!u.pw){pw.style.display='none';}
  else{pw.style.display='block';setTimeout(()=>pw.focus(),50);}
}

function attemptLogin(){
  const uname=document.getElementById('lf-ok').dataset.user;
  const pw=document.getElementById('lf-pw').value;
  const users=loadUsers(),u=users[uname];
  if(!u){document.getElementById('lf-err').textContent='User not found.';return;}
  if(u.pw&&pw!==u.pw){
    document.getElementById('lf-err').textContent='Wrong password.';
    const el=document.getElementById('lf-pw');el.value='';
    el.style.transition='transform .07s';
    [0,1,2,3,4].forEach(i=>setTimeout(()=>{el.style.transform=i%2?'translateX(7px)':'translateX(-7px)';},i*65));
    setTimeout(()=>{el.style.transform='';el.focus();},370);
    return;
  }
  _currentUser=uname;
  clearInterval(_lsClk);if(_lsAnim)_lsAnim.stop();
  const scr=document.getElementById('login-screen');
  scr.style.transition='opacity .36s';scr.style.opacity='0';
  setTimeout(()=>{scr.classList.remove('visible');scr.style.opacity='';initOS();},340);
}

function doLogout(){
  _currentUser=null;
  Object.keys(WINS).forEach(id=>{try{WINS[id].cleanup.forEach(f=>f());WINS[id].el.remove();}catch(e){}delete WINS[id];});
  _cascade=0;_z=10;updateTaskbar();
  document.getElementById('desktop').style.display='none';
  showLogin();
}

let _wid=0, _z=10;
const WINS={};
let _cascade=0;

function createWindow(cfg){
  const id=cfg.id||`w_${_wid++}`;
  if(WINS[id]){focusWin(id);return;}
  sfx.open();
  const W=cfg.w||420, H=cfg.h||340;
  const mw=window.innerWidth, mh=window.innerHeight-48;
  const ox=100+(_cascade%6)*22, oy=60+(_cascade%6)*18; _cascade++;
  const left=Math.min(ox,mw-W-20), top=Math.min(oy,mh-H-20);

  const win=document.createElement('div');
  win.className='os-win';
  win.id='win_'+id;
  win.style.cssText=`left:${left}px;top:${top}px;width:${W}px;height:${H}px;z-index:${++_z};`;

  const cleanup=[];
  WINS[id]={el:win,cleanup,cfg,minimized:false,maximized:false,prevRect:null};

  win.innerHTML=`
    <div class="win-head" id="wh_${id}">
      <div class="win-ctrls">
        <button class="wc wc-close" onclick="closeWin('${id}')" title="Close"></button>
        <button class="wc wc-min" onclick="minWin('${id}')" title="Minimize"></button>
        <button class="wc wc-max" onclick="maxWin('${id}')" title="Maximize"></button>
      </div>
      <span class="win-icon">${cfg.icon||''}</span>
      <span class="win-title">${cfg.title||'Untitled'}</span>
    </div>
    <div class="win-body" id="wb_${id}"></div>
    <div class="win-resize" id="wr_${id}"></div>
  `;

  document.getElementById('win-layer').appendChild(win);
  const winHead=document.getElementById(`wh_${id}`);
  winHead.addEventListener('dblclick',e=>{if(!e.target.classList.contains('wc'))maxWin(id);});
  makeDraggable(win, winHead, id);
  makeResizable(win, document.getElementById(`wr_${id}`));
  win.addEventListener('mousedown', ()=>focusWin(id));

  const body=document.getElementById(`wb_${id}`);
  cfg.fn(body, fn=>cleanup.push(fn));

  updateTaskbar();
  focusWin(id);
}


function isFocused(id){return !!(WINS[id]&&WINS[id].el.classList.contains('focused'));}

function focusWin(id){
  Object.keys(WINS).forEach(k=>WINS[k]?.el?.classList.remove('focused'));
  if(WINS[id]){WINS[id].el.classList.add('focused');WINS[id].el.style.zIndex=++_z;}
  updateTaskbar();
}

function closeWin(id){
  const w=WINS[id];if(!w)return;
  sfx.close();
  w.cleanup.forEach(f=>f());
  w.el.style.animation='winClose .15s ease-out forwards';
  setTimeout(()=>{w.el.remove();},140);
  delete WINS[id];
  _cascade=Math.max(0,_cascade-1);
  updateTaskbar();
}

function minWin(id){
  const w=WINS[id];if(!w)return;
  w.minimized=!w.minimized;
  w.el.classList.toggle('hidden',w.minimized);
  updateTaskbar();
}

function maxWin(id){
  const w=WINS[id];if(!w)return;
  if(!w.maximized){
    w.prevRect={l:w.el.style.left,t:w.el.style.top,wd:w.el.style.width,h:w.el.style.height};
    w.el.classList.add('maximized');
  } else {
    w.el.classList.remove('maximized');
    if(w.prevRect){w.el.style.left=w.prevRect.l;w.el.style.top=w.prevRect.t;w.el.style.width=w.prevRect.wd;w.el.style.height=w.prevRect.h;}
  }
  w.maximized=!w.maximized;
  // Re-trigger canvas resize for games
  w.el.querySelectorAll('canvas').forEach(c=>{
    c.dispatchEvent(new Event('osresize'));
  });
}

function makeDraggable(win, handle, id){
  let sx,sy,sl,st,drag=false;
  handle.addEventListener('mousedown',e=>{
    if(e.target.classList.contains('wc'))return;
    const w=WINS[id]; if(w&&w.maximized)return;
    drag=true; sx=e.clientX; sy=e.clientY;
    sl=win.offsetLeft; st=win.offsetTop;
    e.preventDefault();
  });
  document.addEventListener('mousemove',e=>{
    if(!drag)return;
    win.style.left=(sl+e.clientX-sx)+'px';
    win.style.top=Math.max(0,st+e.clientY-sy)+'px';
  });
  document.addEventListener('mouseup',()=>{drag=false;});
}

function makeResizable(win, handle){
  let drag=false,sx,sy,sw,sh;
  handle.addEventListener('mousedown',e=>{
    drag=true; sx=e.clientX; sy=e.clientY;
    sw=win.offsetWidth; sh=win.offsetHeight;
    e.preventDefault(); e.stopPropagation();
  });
  document.addEventListener('mousemove',e=>{
    if(!drag)return;
    win.style.width=Math.max(240,sw+e.clientX-sx)+'px';
    win.style.height=Math.max(160,sh+e.clientY-sy)+'px';
    win.querySelectorAll('canvas').forEach(c=>c.dispatchEvent(new Event('osresize')));
  });
  document.addEventListener('mouseup',()=>{drag=false;});
}

function updateTaskbar(){
  const tb=document.getElementById('tb-wins');
  tb.innerHTML='';
  Object.keys(WINS).forEach(id=>{
    const w=WINS[id]; if(!w)return;
    const btn=document.createElement('div');
    btn.className='tb-btn'+(w.el.classList.contains('focused')?' active':'');
    btn.title=w.cfg.title;
    btn.innerHTML=`<span>${w.cfg.icon||'📄'}</span><span>${w.cfg.title}</span>`;
    btn.onclick=()=>{
      if(w.minimized){w.minimized=false;w.el.classList.remove('hidden');focusWin(id);}
      else if(w.el.classList.contains('focused')){minWin(id);}
      else{focusWin(id);}
    };
    tb.appendChild(btn);
  });
}

let installed = new Set(Object.keys(BUILTIN));

// ── Per-user install storage ───────────────────────────
function _getSys(){try{const d=localStorage.getItem('oddly_inst_sys');if(d)return new Set(JSON.parse(d));}catch(e){}return new Set();}
function _getUsr(u){try{const d=localStorage.getItem('oddly_inst_usr_'+(u||''));if(d)return new Set(JSON.parse(d));}catch(e){}return new Set();}

function loadInstalled(){
  // Migrate old flat key → system-wide on first run
  try{const old=localStorage.getItem('oddly_installed');if(old){const ids=JSON.parse(old);const s=_getSys();ids.forEach(id=>{if(!BUILTIN[id])s.add(id);});localStorage.setItem('oddly_inst_sys',JSON.stringify([...s]));localStorage.removeItem('oddly_installed');}}catch(e){}
  const sys=_getSys(), usr=_getUsr(_currentUser);
  installed=new Set([...Object.keys(BUILTIN),...sys,...usr]);
}

function saveInstalled(){
  // Used only by Settings reset; individual installs use installToStore()
  const isAdmin=loadUsers()[_currentUser]?.admin;
  if(isAdmin){
    const s=new Set([...installed].filter(id=>!BUILTIN[id]));
    try{localStorage.setItem('oddly_inst_sys',JSON.stringify([...s]));}catch(e){}
  } else {
    const sys=_getSys();
    const personal=new Set([...installed].filter(id=>!BUILTIN[id]&&!sys.has(id)));
    try{localStorage.setItem('oddly_inst_usr_'+_currentUser,JSON.stringify([...personal]));}catch(e){}
  }
}

function installToStore(id){
  const isAdmin=loadUsers()[_currentUser]?.admin;
  if(isAdmin){
    const s=_getSys();s.add(id);
    try{localStorage.setItem('oddly_inst_sys',JSON.stringify([...s]));}catch(e){}
  } else {
    const u=_getUsr(_currentUser);u.add(id);
    try{localStorage.setItem('oddly_inst_usr_'+_currentUser,JSON.stringify([...u]));}catch(e){}
  }
  loadInstalled();renderDesktop();
}


function renderDesktop(){
  const el=document.getElementById('desk-icons');
  el.innerHTML='';
  const apps=[...Object.values(BUILTIN), ...Object.values(STORE_APPS).filter(a=>installed.has(a.id))];
  apps.forEach(app=>{
    const d=document.createElement('div');
    d.className='d-icon';
    d.innerHTML=`<span class="di-em">${app.icon}</span><span class="di-label">${app.name}</span>`;
    d.addEventListener('dblclick',()=>launchApp(app.id));

}

function launchApp(id){
  const app=BUILTIN[id]||STORE_APPS[id];
  if(!app)return;
  if(!installed.has(id)){notify('Not Installed',`Install ${app.name} from the App Store first.`,'amber');return;}
  createWindow({id,title:app.name,icon:app.icon,w:app.w,h:app.h,fn:app.fn});
}

// ══════════════════════════════════════════════════════
function initStars(){
  const canvas=document.getElementById('stars-canvas');
  const ctx=canvas.getContext('2d');
  let stars=[];
  function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;stars=[];}
  function mkStars(){
    for(let i=0;i<160;i++){
      stars.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*1.2+.2,s:Math.random()*0.3+0.05,p:Math.random()*Math.PI*2,a:Math.random()*.8+.2});
    }
  }
  resize();mkStars();
  window.addEventListener('resize',()=>{resize();mkStars();});
  let t=0;
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    t+=0.01;
    stars.forEach(s=>{
      const a=s.a*(0.5+0.5*Math.sin(t*s.s+s.p));
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(180,190,255,${a})`;ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
}

function calcApp(body){

  body.innerHTML=`

      <button class="cb op" data-a="pm">±</button>
      <button class="cb fn" data-a="log">log</button>
      <button class="cb op" data-a="÷">÷</button>
      <button class="cb" data-a="7">7</button>
      <button class="cb" data-a="8">8</button>
      <button class="cb" data-a="9">9</button>
      <button class="cb op" data-a="×">×</button>
      <button class="cb" data-a="4">4</button>
      <button class="cb" data-a="5">5</button>
      <button class="cb" data-a="6">6</button>
      <button class="cb op" data-a="-">−</button>
      <button class="cb" data-a="1">1</button>
      <button class="cb" data-a="2">2</button>
      <button class="cb" data-a="3">3</button>
      <button class="cb op" data-a="+">+</button>
      <button class="cb" data-a="0" style="grid-column:span 2">0</button>
      <button class="cb" data-a=".">.</button>
      <button class="cb eq" data-a="=">=</button>
    </div>
  </div>`;
  body.querySelectorAll('.cb').forEach(btn=>{
    btn.addEventListener('click',()=>{
      sfx.click();
      const a=btn.dataset.a;
      if(a==='clear'){expr='';val='0';}
      else if(a==='='){ try{let e=expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');val=String(eval(e));expr='';if(val.length>12)val=parseFloat(val).toPrecision(8);}catch{val='Error';expr='';}}
      else if(a==='sqrt'){try{val=String(Math.sqrt(parseFloat(val)||0));}catch{val='Error';}}
      else if(a==='sin'){val=String(Math.sin(parseFloat(val)*Math.PI/180));}
      else if(a==='cos'){val=String(Math.cos(parseFloat(val)*Math.PI/180));}
      else if(a==='log'){val=String(Math.log10(parseFloat(val)||1));}
      else if(a==='pct'){val=String(parseFloat(val)/100);}
      else if(a==='pm'){val=String(-parseFloat(val));}
      else if(['+','-','×','÷'].includes(a)){expr=(expr||val)+a;val='';}
      else{val=(val==='0'||val==='Error')?a:(val+a);}
      document.getElementById('calc-expr').textContent=expr;
      document.getElementById('calc-val').textContent=val||'0';
    });
  });
}

    version:()=>{pr('Oddly OS 1.0.0 (build 2026.06.13)','hi');},
    apps:()=>{pr([...installed].join('  '),'');},
    users:()=>{
      const us=loadUsers();
      pr('NAME        ROLE            PW','hi');
      Object.entries(us).forEach(([n,u])=>{
        pr(n.padEnd(12)+(u.admin?'Administrator':'User').padEnd(16)+(u.pw?'set':'none')+(n===_currentUser?' ◀ (you)':''),'');
      });
    },
    su:(args)=>{
      const tgt=(args[0]==='-'||!args[0])?'root':args[0];
      const users=loadUsers();
      if(!users[tgt]){pr(`su: unknown user: ${tgt}`,'err');return;}
      if(tgt===_currentUser){pr(`Already ${tgt}.`,'');return;}
      // Root can switch to any user without a password
      if(users[_currentUser]?.admin){
        _currentUser=tgt;updateTbUser();upPrompt();loadInstalled();renderDesktop();
        pr(`Switched to ${tgt}.${users[tgt].admin?' ★ You are root.':''}`,'sys');return;
      }
      if(!users[tgt].pw){
        _currentUser=tgt;updateTbUser();upPrompt();loadInstalled();renderDesktop();
        pr(`Switched to ${tgt}.${users[tgt].admin?' You are now root. ★':''}`,'sys');return;
      }
      _sw={target:tgt,mode:'su'};pr(`Password for ${tgt}:`,'sys');inp.type='password';
    },
    sudo:(args)=>{
      if(args[0]==='su'){
        const tgt=(args[1]&&args[1]!=='-')?args[1]:'root';
        const users=loadUsers();
        if(!users[tgt]){pr(`sudo su: unknown user: ${tgt}`,'err');return;}
        if(users[_currentUser]?.admin){
          // Already root — switch directly, no password needed
          _currentUser=tgt;updateTbUser();upPrompt();loadInstalled();renderDesktop();
          pr(`Switched to ${tgt}.`+(users[tgt].admin?' ★':''),'sys');return;
        }
        const rootPw=users['root']?.pw;
        if(!rootPw){
          _currentUser=tgt;updateTbUser();upPrompt();loadInstalled();renderDesktop();
          pr(`[sudo] Switched to ${tgt}.${users[tgt].admin?' You are now root. ★':''}`,'sys');return;
        }
        _sw={target:tgt,mode:'sudo'};
        pr(`[sudo] Password for root:`,'sys');inp.type='password';
      } else if(!args[0]){
        pr('Usage: sudo su [user]  — elevate to root (or another user) using root\'s password','');
      } else {
        pr(`sudo: ${args[0]}: command not supported. Try: sudo su`,'err');
      }
    },
    passwd:(args)=>{
      const tgt=args[0]||_currentUser;
      const users=loadUsers(),cu=users[_currentUser];
      if(!cu?.admin&&tgt!==_currentUser){pr('passwd: permission denied','err');return;}
      if(!users[tgt]){pr(`passwd: user ${tgt} not found`,'err');return;}
      pr(`New password for ${tgt} (blank to clear):`,'sys');
      _sw={target:tgt,mode:'passwd'};inp.type='password';
    },
    adduser:(args)=>{
      if(!loadUsers()[_currentUser]?.admin){pr('adduser: permission denied','err');return;}
      const n=args[0];
      if(!n){pr('Usage: adduser &lt;username&gt;','err');return;}
      if(!/^[a-z][a-z0-9_]{0,14}$/.test(n)){pr('Invalid username (lowercase letters/numbers/_)','err');return;}
      const u=loadUsers();if(u[n]){pr(`User "${n}" already exists`,'err');return;}
      u[n]={pw:'',admin:false,icon:'👤',name:n};saveUsers(u);
      pr(`User "${n}" created. Set password: passwd ${n}`,'hi');
    },
    deluser:(args)=>{
      const users=loadUsers();
      if(!users[_currentUser]?.admin){pr('deluser: permission denied','err');return;}
      const n=args[0];if(!n){pr('Usage: deluser &lt;username&gt;','err');return;}
      if(n==='root'){pr('Cannot delete root','err');return;}
      if(n===_currentUser){pr('Cannot delete yourself','err');return;}
      if(!users[n]){pr(`User "${n}" not found`,'err');return;}
      delete users[n];saveUsers(users);pr(`User "${n}" deleted.`,'sys');
    },
    logout:()=>{pr(`Logging out ${_currentUser}…`,'sys');setTimeout(doLogout,500);},
    ls:()=>{pr('Desktop/  Documents/  Downloads/  .secret/  .readme','');},
    joke:()=>{const j=['Why do programmers prefer dark mode? Because light attracts bugs.','A SQL query walks into a bar, walks up to two tables and asks... "Can I join you?"','Why was the JavaScript developer sad? Because he didn\'t Node how to Express himself.'];pr(j[Math.floor(Math.random()*j.length)],'hi');},
    coffee:()=>{pr('☕  Brewing... ████████░░ 82% complete — ah who are we kidding, it\'s always 82%','sys');},
    matrix:()=>{
      pr('Entering the matrix...','sys');
      let m='';for(let i=0;i<8;i++){let row='';for(let j=0;j<40;j++)row+=Math.random()<0.5?'0':'1';m+=row+'\n';}
      pr(m,'hi');pr('You are now awake.','');
    },
    calc:(args)=>{try{pr(String(eval(args.join(' '))));} catch{pr('Syntax error','err');}},
    echo:(args)=>{pr(args.join(' '));},
  };
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){
      const raw=inp.value; inp.value=''; inp.type='text';

      // Password capture mode for su / passwd
      if(_sw){
        const {target:tgt,mode}=_sw; _sw=null;
        if(mode==='su'){
          const users=loadUsers();
          if(users[tgt]?.pw===raw){
            _currentUser=tgt; updateTbUser(); upPrompt(); loadInstalled(); renderDesktop();
            pr(`Switched to ${tgt}.${users[tgt].admin?' You are now root. ★':''}`,'sys');
          } else {
            pr('su: authentication failure','err');
          }
        } else if(mode==='sudo'){
          const users=loadUsers();
          if(users['root']?.pw===raw){
            _currentUser=tgt; updateTbUser(); upPrompt(); loadInstalled(); renderDesktop();
            pr(`[sudo] Switched to ${tgt}.${users[tgt].admin?' You are now root. ★':''}`,'sys');
          } else {
            pr('[sudo] sudo: authentication failure','err');
          }
        } else if(mode==='passwd'){
          const u=loadUsers(); u[tgt].pw=raw; saveUsers(u);
          pr(raw?`Password updated for ${tgt}.`:`Password removed for ${tgt}.`,'hi');
        }
        out.scrollTop=9999; return;
      }

      const trimmed=raw.trim(); if(!trimmed)return;
      history.unshift(trimmed); hIdx=-1;
      pr(`${promptEl.textContent} ${trimmed}`,'cmd-in');
      const [cmd,...args]=trimmed.split(' ');
      if(cmds[cmd])cmds[cmd](args);
      else pr(`command not found: ${cmd}. Type "help".`,'err');
      out.scrollTop=9999;
    }
    if(!_sw){
      if(e.key==='ArrowUp'){hIdx=Math.min(hIdx+1,history.length-1);inp.value=history[hIdx]||'';}
      if(e.key==='ArrowDown'){hIdx=Math.max(hIdx-1,-1);inp.value=hIdx<0?'':history[hIdx];}
    }
  });
  inp.focus();
}

function chatApp(body, reg){
  const messages=[];
  const apiKey=()=>localStorage.getItem('oddly_api')||'';
  body.innerHTML=`
  <div class="chat-wrap">
    <div class="chat-key-bar">
      <span>🔑 API Key:</span>
      <input type="password" id="chat-key" placeholder="sk-ant-… (or set in Settings)" value="${escHTML(apiKey())}">
      <button onclick="document.getElementById('chat-key').value&&(localStorage.setItem('oddly_api',document.getElementById('chat-key').value),this.textContent='✓')">Set</button>
    </div>
    <div class="chat-msgs" id="chat-msgs">
      <div class="c-msg ai">👋 Hey! I'm <b>Oddly</b>, your built-in AI assistant. Ask me anything — I'm powered by Claude and ready to help!</div>
    </div>
    <div class="chat-bottom">
      <input class="chat-input" id="chat-in" type="text" placeholder="Ask Oddly anything…">
      <button class="chat-send" id="chat-send" onclick="chatSend()">Send</button>
    </div>
  </div>`;

  const inp=body.querySelector('#chat-in');
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')chatSend();});

  function chatSend(){
    const key=body.querySelector('#chat-key').value.trim()||apiKey();
    if(!key){notify('Oddly Chat','Please enter your Anthropic API key.','amber');return;}
    const text=inp.value.trim();if(!text)return;
    inp.value='';
    const msgArea=body.querySelector('#chat-msgs');
    const addMsg=(html,cls)=>{const d=document.createElement('div');d.className=`c-msg ${cls}`;d.innerHTML=html;msgArea.appendChild(d);msgArea.scrollTop=9999;return d;};
    addMsg(escHTML(text),'user');
    messages.push({role:'user',content:text});
    const typing=addMsg(`<div class="c-dot"></div><div class="c-dot"></div><div class="c-dot"></div>`,'ai typing');
    const send=body.querySelector('#chat-send');send.disabled=true;

    fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({
        model:'claude-haiku-5-5',
        max_tokens:4000,
        output_config:{effort:'low'},
        system:"You are Oddly, the friendly built-in AI assistant for Oddly OS. You're clever, helpful, and a little quirky (fitting the OS name). Keep responses conversational and concise unless more depth is needed. You live inside a browser-based OS simulation. Format your answers in clean HTML if it helps readability (use <b>, <i>, <code> tags sparingly).",
        messages:[...messages],
      })
    })
    .then(r=>r.json())
    .then(d=>{
      typing.remove();
      const reply=d.content?.find(b=>b.type==='text')?.text||(d.stop_reason==='refusal'?'Sorry, I can\'t help with that one.':'')||d.error?.message||'Something went wrong.';
      messages.push({role:'assistant',content:reply});
      addMsg(escHTML(reply).replace(/&lt;(\/?)(b|i|code|br)&gt;/g,'<$1$2>').replace(/\n/g,'<br>'),'ai');
    })
    .catch(err=>{typing.remove();addMsg('⚠️ '+escHTML(err.message),'ai');})
    .finally(()=>{send.disabled=false;inp.focus();});
  }

  // expose to global for button onclick
  window.chatSend=chatSend;
  reg(()=>{delete window.chatSend;});
}

//  GAME: STREET JUMPER
// ══════════════════════════════════════════════════════
function streetJumperApp(body, reg){
  body.innerHTML=`
  <div class="game-canvas-wrap">
    <div class="game-ui-bar">
      <span class="game-score" id="sj-score">Score: 0</span>
      <span class="game-score" id="sj-hi" style="color:var(--amber)">Best: ${localStorage.getItem('sj_hi')||0}</span>
      <button class="game-btn" id="sj-restart">Restart</button>
    </div>
    <canvas id="sj-canvas"></canvas>
  </div>`;
  const canvas=body.querySelector('#sj-canvas');
  const ctx=canvas.getContext('2d');
  const resize=()=>{canvas.width=canvas.offsetWidth;canvas.height=canvas.offsetHeight;};
  canvas.addEventListener('osresize',resize);
  setTimeout(resize,50);

  let P,obs,particles,score,speed,frame,running,hi=parseInt(localStorage.getItem('sj_hi')||'0'),gameover=false;
  const GRAV=0.55, JUMP=-13, GH=55;

  function reset(){
    P={x:80,y:0,vy:0,w:28,h:38,onGround:true,legs:0};
    obs=[];particles=[];score=0;speed=3.8;gameover=false;running=true;
    frame=requestAnimationFrame(loop);
    body.querySelector('#sj-score').textContent='Score: 0';
  }

  function spawnObs(){
    const types=[
      {w:18,h:45},{w:22,h:60},{w:30,h:35},{w:16,h:80},
    ];
    const t=types[Math.floor(Math.random()*types.length)];
    obs.push({x:canvas.width+10,y:canvas.height-GH-t.h,w:t.w,h:t.h});
  }

  function emit(x,y){
    for(let i=0;i<6;i++){
      particles.push({x,y,vx:(Math.random()-.5)*4,vy:-Math.random()*4-1,life:1,r:Math.random()*3+1});
    }
  }

  let spawnTimer=0;
  function loop(){
    if(!running)return;
    frame=requestAnimationFrame(loop);
    const GY=canvas.height-GH;
    P.vy+=GRAV;P.y+=P.vy;
    if(P.y>=GY-P.h){P.y=GY-P.h;P.vy=0;P.onGround=true;}
    else P.onGround=false;
    P.legs+= P.onGround?0.25:0;
    score+=0.05;speed=3.8+score*0.006;
    spawnTimer+=speed;
    if(spawnTimer>320+Math.random()*180){spawnTimer=0;spawnObs();}
    obs=obs.filter(o=>{o.x-=speed;return o.x+o.w>-10;});
    particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.2;p.life-=0.04;});
    particles=particles.filter(p=>p.life>0);

    // Collision
    for(const o of obs){
      if(P.x+P.w-6>o.x&&P.x+6<o.x+o.w&&P.y+P.h-4>o.y&&P.y+4<o.y+o.h){
        emit(P.x+P.w/2,P.y+P.h/2);running=false;gameover=true;
        sfx.over();const sc=Math.floor(score);if(sc>hi){hi=sc;try{localStorage.setItem('sj_hi',hi);}catch(e){}}
        body.querySelector('#sj-hi').textContent='Best: '+hi;
        break;
      }
    }

    // DRAW
    const W=canvas.width,H=canvas.height;
    // BG
    ctx.fillStyle='#050510';ctx.fillRect(0,0,W,H);
    // Grid lines
    ctx.strokeStyle='rgba(99,102,241,.08)';ctx.lineWidth=1;
    for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    for(let x=(Date.now()*.6)%80;x<W;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}

    // Ground
    const gg=ctx.createLinearGradient(0,GY,0,H);
    gg.addColorStop(0,'rgba(99,102,241,.6)');gg.addColorStop(1,'rgba(34,211,238,.15)');
    ctx.fillStyle=gg;ctx.fillRect(0,GY,W,H-GY);
    ctx.fillStyle='rgba(200,200,255,.4)';ctx.fillRect(0,GY,W,2);

    // Player
    if(!gameover||(Date.now()%400<300)){
      ctx.fillStyle='#22d3ee';
      ctx.fillRect(P.x,P.y,P.w,P.h-12);
      // visor
      ctx.fillStyle='rgba(99,102,241,.9)';ctx.fillRect(P.x+4,P.y+6,P.w-8,10);
      ctx.fillStyle='rgba(255,255,255,.4)';ctx.fillRect(P.x+6,P.y+8,6,5);
      // legs
      const la=Math.sin(P.legs)*8;
      ctx.fillStyle='#0891b2';
      ctx.fillRect(P.x+4,P.y+P.h-12,8,12+la);
      ctx.fillRect(P.x+P.w-12,P.y+P.h-12,8,12-la);
    }

    // Obstacles
    obs.forEach(o=>{
      const og=ctx.createLinearGradient(0,o.y,0,o.y+o.h);
      og.addColorStop(0,'#7c3aed');og.addColorStop(1,'#4c1d95');
      ctx.fillStyle=og;ctx.fillRect(o.x,o.y,o.w,o.h);
      ctx.fillStyle='rgba(139,92,246,.5)';ctx.fillRect(o.x,o.y,o.w,4);
    });

    // Particles
    particles.forEach(p=>{
      ctx.globalAlpha=p.life;ctx.fillStyle='#22d3ee';
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    });
    ctx.globalAlpha=1;

    // Score
    body.querySelector('#sj-score').textContent='Score: '+Math.floor(score);

    if(gameover){
      ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#fff';ctx.font='bold 28px system-ui';ctx.textAlign='center';
      ctx.fillText('GAME OVER',W/2,H/2-20);
      ctx.font='16px system-ui';ctx.fillStyle='var(--cyan,#22d3ee)';
      ctx.fillText(`Score: ${Math.floor(score)}   Best: ${hi}`,W/2,H/2+12);
      ctx.font='13px system-ui';ctx.fillStyle='#8892a4';
      ctx.fillText('Click or press Space to restart',W/2,H/2+38);
      ctx.textAlign='left';
    }
  }

  const onKey=e=>{
    if(!isFocused('streetjumper'))return;
    if(e.code==='Space'||e.code==='ArrowUp'){
      e.preventDefault();
      if(gameover){reset();return;}
      if(P.onGround){P.vy=JUMP;P.onGround=false;sfx.jump();}
    }
  };
  const onClick=()=>{
    if(gameover){reset();return;}
    if(P.onGround){P.vy=JUMP;P.onGround=false;sfx.jump();}
  };
  document.addEventListener('keydown',onKey);
  canvas.addEventListener('click',onClick);
  body.querySelector('#sj-restart').addEventListener('click',()=>reset());
  reg(()=>{cancelAnimationFrame(frame);running=false;document.removeEventListener('keydown',onKey);});
  reset();
}

// ══════════════════════════════════════════════════════
//  GAME: STAR SHOOTER
// ══════════════════════════════════════════════════════
function starShooterApp(body, reg){
  body.innerHTML=`
  <div class="game-canvas-wrap">
    <div class="game-ui-bar">
      <span class="game-score" id="ss-score">Score: 0</span>
      <span class="game-score" style="color:var(--red)">❤️ <span id="ss-hp">3</span></span>
      <span class="game-score" style="color:var(--amber)" id="ss-wave">Wave 1</span>
      <button class="game-btn" id="ss-restart">Restart</button>
    </div>
    <canvas id="ss-canvas"></canvas>
  </div>`;
  const canvas=body.querySelector('#ss-canvas');
  const ctx=canvas.getContext('2d');
  const resize=()=>{canvas.width=canvas.offsetWidth;canvas.height=canvas.offsetHeight;};
  canvas.addEventListener('osresize',resize);
  setTimeout(resize,50);

  let player,bullets,enemies,particles,score,hp,wave,frame,running=false,gameover=false;
  const keys={};

  function reset(){
    const W=canvas.width,H=canvas.height;
    player={x:W/2,y:H-70,w:36,h:36,speed:4.5};
    bullets=[];enemies=[];particles=[];score=0;hp=3;wave=1;gameover=false;running=true;
    body.querySelector('#ss-score').textContent='Score: 0';
    body.querySelector('#ss-hp').textContent='3';
    body.querySelector('#ss-wave').textContent='Wave 1';
    spawnWave();frame=requestAnimationFrame(loop);
  }

  function spawnWave(){
    const W=canvas.width;
    const rows=Math.min(3,wave),cols=Math.min(7,4+wave);
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
      enemies.push({x:c*(W/(cols+1))+W/(cols+1)*.5,y:40+r*52,w:28,h:22,hp:1,vy:0.4+wave*0.15,vx:(Math.random()-.5)*0.6,phase:Math.random()*Math.PI*2});
    }
  }

  let sFire=0;
  function loop(){
    if(!running)return;
    frame=requestAnimationFrame(loop);
    const W=canvas.width,H=canvas.height;
    if(keys['ArrowLeft']||keys['a'])player.x=Math.max(player.w/2,player.x-player.speed);
    if(keys['ArrowRight']||keys['d'])player.x=Math.min(W-player.w/2,player.x+player.speed);

    sFire++;if(sFire>18){sFire=0;bullets.push({x:player.x,y:player.y-20,vy:-9,w:4,h:12});}

    bullets.forEach(b=>{b.y+=b.vy;});
    bullets=bullets.filter(b=>b.y>-20);
    enemies.forEach(e=>{e.y+=e.vy;e.x+=e.vx+Math.sin(Date.now()*0.002+e.phase)*0.8;});

    // bullet-enemy
    for(let i=bullets.length-1;i>=0;i--){
      for(let j=enemies.length-1;j>=0;j--){
        const b=bullets[i],e=enemies[j];
        if(b.x>e.x-e.w/2&&b.x<e.x+e.w/2&&b.y>e.y&&b.y<e.y+e.h){
          sfx.hit();bullets.splice(i,1);e.hp--;
          for(let k=0;k<8;k++)particles.push({x:e.x,y:e.y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,life:1,c:`hsl(${30+Math.random()*40},100%,60%)`});
          if(e.hp<=0){score+=10;body.querySelector('#ss-score').textContent='Score: '+score;enemies.splice(j,1);}
          break;
        }
      }
    }

    // enemy hits player
    for(let i=enemies.length-1;i>=0;i--){
      const e=enemies[i];
      if(Math.abs(e.x-player.x)<(e.w/2+player.w/2)&&Math.abs(e.y-player.y)<(e.h/2+player.h/2)||e.y>H+20){
        enemies.splice(i,1);hp--;
        body.querySelector('#ss-hp').textContent=hp;
        if(hp<=0){running=false;gameover=true;sfx.over();}
      }
    }

    if(enemies.length===0&&!gameover){wave++;body.querySelector('#ss-wave').textContent='Wave '+wave;spawnWave();}

    particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life-=0.05;});
    particles=particles.filter(p=>p.life>0);

    // DRAW
    ctx.fillStyle='#030310';ctx.fillRect(0,0,W,H);
    // Stars
    ctx.fillStyle='rgba(200,210,255,.4)';
    for(let i=0;i<60;i++){const s=(i*7171)%1;ctx.fillRect((i*137)%W,((i*113+Date.now()*.05)%H),1,1);}

    // Player ship
    ctx.fillStyle='#22d3ee';
    ctx.beginPath();ctx.moveTo(player.x,player.y-player.h/2);ctx.lineTo(player.x-player.w/2,player.y+player.h/2);ctx.lineTo(player.x+player.w/2,player.y+player.h/2);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(99,102,241,.8)';ctx.fillRect(player.x-4,player.y,8,player.h/2);
    // Engine glow
    const eg=ctx.createRadialGradient(player.x,player.y+player.h/2,0,player.x,player.y+player.h/2,20);
    eg.addColorStop(0,'rgba(99,102,241,.6)');eg.addColorStop(1,'transparent');
    ctx.fillStyle=eg;ctx.beginPath();ctx.arc(player.x,player.y+player.h/2,20,0,Math.PI*2);ctx.fill();

    // Bullets
    ctx.fillStyle='#fbbf24';
    bullets.forEach(b=>{ctx.fillRect(b.x-b.w/2,b.y,b.w,b.h);});

    // Enemies
    enemies.forEach(e=>{
      ctx.fillStyle='#ef4444';
      ctx.beginPath();ctx.moveTo(e.x,e.y+e.h);ctx.lineTo(e.x-e.w/2,e.y);ctx.lineTo(e.x+e.w/2,e.y);ctx.closePath();ctx.fill();
      ctx.fillStyle='rgba(255,80,80,.4)';ctx.beginPath();ctx.arc(e.x,e.y+e.h/2,e.w*.4,0,Math.PI*2);ctx.fill();
    });

    // Particles
    particles.forEach(p=>{ctx.globalAlpha=p.life;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();});
    ctx.globalAlpha=1;

    if(gameover){
      ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#fff';ctx.font='bold 26px system-ui';ctx.textAlign='center';
      ctx.fillText('GAME OVER',W/2,H/2-20);
      ctx.font='15px system-ui';ctx.fillStyle='#22d3ee';
      ctx.fillText(`Score: ${score}  ·  Wave ${wave}`,W/2,H/2+12);
      ctx.font='12px system-ui';ctx.fillStyle='#8892a4';ctx.fillText('Press Space to restart',W/2,H/2+36);ctx.textAlign='left';
    }
  }

  const onKey=e=>{if(!isFocused('starshooter')){keys={};return;}keys[e.code]=true;if(e.code==='Space'&&gameover)reset();e.preventDefault();};
  const onKeyUp=e=>{keys[e.code]=false;};
  document.addEventListener('keydown',onKey);document.addEventListener('keyup',onKeyUp);
  body.querySelector('#ss-restart').addEventListener('click',reset);
  reg(()=>{cancelAnimationFrame(frame);running=false;document.removeEventListener('keydown',onKey);document.removeEventListener('keyup',onKeyUp);});
  setTimeout(reset,60);
}

// ══════════════════════════════════════════════════════
//  GAME: SNAKE
// ══════════════════════════════════════════════════════
function snakeApp(body, reg){
  body.innerHTML=`
  <div class="game-canvas-wrap">
    <div class="game-ui-bar">
      <span class="game-score" id="sn-score">Score: 0</span>
      <span class="game-score" style="color:var(--amber)" id="sn-hi">Best: 0</span>
    </div>
    <canvas id="sn-canvas"></canvas>
  </div>`;
  const canvas=body.querySelector('#sn-canvas');
  const ctx=canvas.getContext('2d');
  canvas.addEventListener('osresize',()=>{canvas.width=canvas.offsetWidth;canvas.height=canvas.offsetHeight;});
  setTimeout(()=>{canvas.width=canvas.offsetWidth;canvas.height=canvas.offsetHeight;},50);

  const CELL=18,ROWS=20,COLS=20;
  let snake,dir,nextDir,food,score,hi=0,interval,gameover=false;

  function reset(){
    snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    dir={x:1,y:0};nextDir={x:1,y:0};score=0;gameover=false;
    placeFood();
    body.querySelector('#sn-score').textContent='Score: 0';
    clearInterval(interval);interval=setInterval(step,130);
    draw();
  }

  function placeFood(){
    let fx,fy;
    do{fx=Math.floor(Math.random()*COLS);fy=Math.floor(Math.random()*ROWS);}
    while(snake.some(s=>s.x===fx&&s.y===fy));
    food={x:fx,y:fy};
  }

  function step(){
    if(gameover)return;
    dir={...nextDir};
    const head={x:(snake[0].x+dir.x+COLS)%COLS,y:(snake[0].y+dir.y+ROWS)%ROWS};
    if(snake.some(s=>s.x===head.x&&s.y===head.y)){
      gameover=true;clearInterval(interval);sfx.over();
      hi=Math.max(hi,score);try{localStorage.setItem('sn_hi',hi);}catch(e){}body.querySelector('#sn-hi').textContent='Best: '+hi;
      draw();return;
    }
    snake.unshift(head);
    if(head.x===food.x&&head.y===food.y){
      score+=10;body.querySelector('#sn-score').textContent='Score: '+score;
      sfx.coin();placeFood();
    } else snake.pop();
    draw();
  }

  function draw(){
    const W=canvas.width,H=canvas.height;
    const ox=Math.floor((W-COLS*CELL)/2),oy=Math.floor((H-ROWS*CELL)/2);
    ctx.fillStyle='#050510';ctx.fillRect(0,0,W,H);
    // Grid
    ctx.strokeStyle='rgba(255,255,255,.04)';ctx.lineWidth=1;
    for(let r=0;r<=ROWS;r++){ctx.beginPath();ctx.moveTo(ox,oy+r*CELL);ctx.lineTo(ox+COLS*CELL,oy+r*CELL);ctx.stroke();}
    for(let c=0;c<=COLS;c++){ctx.beginPath();ctx.moveTo(ox+c*CELL,oy);ctx.lineTo(ox+c*CELL,oy+ROWS*CELL);ctx.stroke();}
    // Food
    ctx.fillStyle='#f87171';
    ctx.beginPath();ctx.arc(ox+food.x*CELL+CELL/2,oy+food.y*CELL+CELL/2,CELL*.35,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,180,180,.4)';
    ctx.beginPath();ctx.arc(ox+food.x*CELL+CELL/2-1,oy+food.y*CELL+CELL/2-2,CELL*.1,0,Math.PI*2);ctx.fill();
    // Snake
    snake.forEach((s,i)=>{
      const g=ctx.createLinearGradient(ox+s.x*CELL,oy+s.y*CELL,ox+s.x*CELL+CELL,oy+s.y*CELL+CELL);
      g.addColorStop(0,i===0?'#22d3ee':'#10b981');g.addColorStop(1,i===0?'#0891b2':'#059669');
      ctx.fillStyle=g;ctx.fillRect(ox+s.x*CELL+1,oy+s.y*CELL+1,CELL-2,CELL-2);
      if(i===0){ctx.fillStyle='rgba(255,255,255,.8)';ctx.fillRect(ox+s.x*CELL+4,oy+s.y*CELL+4,3,3);ctx.fillRect(ox+s.x*CELL+CELL-7,oy+s.y*CELL+4,3,3);}
    });
    if(gameover){
      ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#fff';ctx.font='bold 24px system-ui';ctx.textAlign='center';
      ctx.fillText('GAME OVER',W/2,H/2-15);
      ctx.font='14px system-ui';ctx.fillStyle='#22d3ee';ctx.fillText('Score: '+score,W/2,H/2+10);
      ctx.font='12px system-ui';ctx.fillStyle='#8892a4';ctx.fillText('Press Space to restart',W/2,H/2+32);ctx.textAlign='left';
    }
  }

  const onKey=e=>{
    if(!isFocused('snakegame'))return;
    const m={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},
              w:{x:0,y:-1},s:{x:0,y:1},a:{x:-1,y:0},d:{x:1,y:0}};
    if(m[e.key]){if(m[e.key].x!==-dir.x||m[e.key].y!==-dir.y)nextDir=m[e.key];e.preventDefault();}
    if(e.code==='Space'&&gameover)reset();
  };
  document.addEventListener('keydown',onKey);
  reg(()=>{clearInterval(interval);document.removeEventListener('keydown',onKey);});
  reset();
}


// ══════════════════════════════════════════════════════
//  GAME: BREAKOUT
// ══════════════════════════════════════════════════════
function breakoutApp(body, reg){
  const hiKey='bo_hi';
  body.innerHTML=`
  <div class="game-canvas-wrap">
    <div class="game-ui-bar">
      <span class="game-score" id="bo-score">Score: 0</span>
      <span class="game-score" style="color:var(--amber)">Lvl <span id="bo-level">1</span></span>
      <span class="game-score" style="color:var(--red)">❤️ <span id="bo-lives">3</span></span>
      <span class="game-score" style="color:var(--muted)">Best: <span id="bo-hi">${localStorage.getItem(hiKey)||0}</span></span>
      <button class="game-btn" id="bo-restart">Restart</button>
    </div>
    <canvas id="bo-canvas"></canvas>
  </div>`;
  const canvas=body.querySelector('#bo-canvas');
  const ctx=canvas.getContext('2d');
  const resize=()=>{canvas.width=canvas.offsetWidth;canvas.height=canvas.offsetHeight;};
  canvas.addEventListener('osresize',()=>{resize();if(bricks)initBricks();});
  setTimeout(resize,70);

  const PADDLE_H=11,BALL_R=7,BRICK_ROWS=5,BRICK_COLS=9,BRICK_H=16,BRICK_GAP=4;
  const BRICK_COLORS=['#ef4444','#f97316','#eab308','#22c55e','#3b82f6'];
  let paddle,ball,bricks,score,lives,level,frame,running=false,waiting=true,gameover=false,hi=parseInt(localStorage.getItem(hiKey)||'0');

  function initBricks(){
    const W=canvas.width;
    const bw=Math.floor((W-28-BRICK_GAP*(BRICK_COLS-1))/BRICK_COLS);
    bricks=[];
    for(let r=0;r<BRICK_ROWS;r++)for(let c=0;c<BRICK_COLS;c++){
      bricks.push({x:14+c*(bw+BRICK_GAP),y:55+r*(BRICK_H+BRICK_GAP),w:bw,h:BRICK_H,alive:true,color:BRICK_COLORS[r%BRICK_COLORS.length],hp:r<2?1:r<4?2:3});
    }
  }

  function reset(){
    const W=canvas.width,H=canvas.height;
    score=0;lives=3;level=1;gameover=false;waiting=true;
    paddle={x:W/2,w:Math.min(92,W*.22)};
    ball={x:W/2,y:H-80,vx:3*(Math.random()>.5?1:-1),vy:-4.5};
    initBricks();
    body.querySelector('#bo-score').textContent='Score: 0';
    body.querySelector('#bo-level').textContent='1';
    body.querySelector('#bo-lives').textContent='3';
    cancelAnimationFrame(frame);frame=requestAnimationFrame(loop);
  }

  function nextLevel(){
    level++;waiting=true;
    const W=canvas.width,H=canvas.height;
    ball={x:W/2,y:H-80,vx:(3.2+level*.45)*(Math.random()>.5?1:-1),vy:-(4.5+level*.5)};
    paddle.x=W/2;initBricks();
    body.querySelector('#bo-level').textContent=level;
    notify('Breakout','Level '+level+'! Things just got faster!','cyan');
  }

  let mouseX=null;
  canvas.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect();mouseX=e.clientX-r.left;if(waiting&&!gameover)waiting=false;});
  canvas.addEventListener('touchmove',e=>{const r=canvas.getBoundingClientRect();mouseX=e.touches[0].clientX-r.left;if(waiting&&!gameover)waiting=false;e.preventDefault();},{passive:false});
  canvas.addEventListener('click',()=>{if(gameover){reset();}else if(waiting){waiting=false;}});

  function loop(){
    frame=requestAnimationFrame(loop);
    if(!running){draw();return;}
    const W=canvas.width,H=canvas.height;
    if(mouseX!==null)paddle.x=Math.max(paddle.w/2,Math.min(W-paddle.w/2,mouseX));
    if(!waiting){
      ball.x+=ball.vx;ball.y+=ball.vy;
      if(ball.x-BALL_R<0){ball.x=BALL_R;ball.vx=Math.abs(ball.vx);}
      if(ball.x+BALL_R>W){ball.x=W-BALL_R;ball.vx=-Math.abs(ball.vx);}
      if(ball.y-BALL_R<0){ball.y=BALL_R;ball.vy=Math.abs(ball.vy);}
      // Paddle
      const py=H-PADDLE_H-12;
      if(ball.y+BALL_R>py&&ball.y+BALL_R<py+PADDLE_H+14&&ball.x>paddle.x-paddle.w/2&&ball.x<paddle.x+paddle.w/2){
        ball.vy=-Math.abs(ball.vy);
        ball.vx+=((ball.x-paddle.x)/paddle.w)*3.8;
        ball.vx=Math.max(-10,Math.min(10,ball.vx));
        // small sfx via oscillator
        try{const o=ac().createOscillator(),g=ac().createGain();o.connect(g);g.connect(ac().destination);o.frequency.value=500;g.gain.setValueAtTime(.06,ac().currentTime);g.gain.exponentialRampToValueAtTime(.001,ac().currentTime+.08);o.start();o.stop(ac().currentTime+.08);}catch(e){}
      }
      // Fall
      if(ball.y>H+20){
        lives--;body.querySelector('#bo-lives').textContent=lives;
        if(lives<=0){gameover=true;running=false;if(score>hi){hi=score;try{localStorage.setItem(hiKey,hi);}catch(e){}body.querySelector('#bo-hi').textContent=hi;}}
        else{ball={x:W/2,y:H-80,vx:(3+level*.3)*(Math.random()>.5?1:-1),vy:-(4.5+level*.4)};waiting=true;}
      }
      // Bricks
      for(const b of bricks){
        if(!b.alive)continue;
        if(ball.x+BALL_R>b.x&&ball.x-BALL_R<b.x+b.w&&ball.y+BALL_R>b.y&&ball.y-BALL_R<b.y+b.h){
          b.hp--;if(b.hp<=0){b.alive=false;score+=10+level*2;}else{score+=3;}
          body.querySelector('#bo-score').textContent='Score: '+score;
          // Bounce off which face
          const ot=Math.abs(ball.y-b.y-b.h),ob=Math.abs(ball.y-b.y),ol=Math.abs(ball.x-b.x-b.w),or2=Math.abs(ball.x-b.x);
          const mn=Math.min(ot,ob,ol,or2);
          if(mn===ot||mn===ob)ball.vy=-ball.vy;else ball.vx=-ball.vx;
          try{const o=ac().createOscillator(),g=ac().createGain();o.connect(g);g.connect(ac().destination);o.type='square';o.frequency.value=380+b.hp*60;g.gain.setValueAtTime(.04,ac().currentTime);g.gain.exponentialRampToValueAtTime(.001,ac().currentTime+.06);o.start();o.stop(ac().currentTime+.06);}catch(e){}
          break;
        }
      }
      if(bricks.every(b=>!b.alive))nextLevel();
    }
    draw();
  }

  function draw(){
    const W=canvas.width,H=canvas.height;
    ctx.fillStyle='#04040e';ctx.fillRect(0,0,W,H);
    // Subtle grid bg
    ctx.strokeStyle='rgba(99,102,241,.04)';ctx.lineWidth=1;
    for(let y=0;y<H;y+=30){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    // Bricks
    bricks.forEach(b=>{
      if(!b.alive)return;
      const a=b.hp===3?1:b.hp===2?.72:.48;
      ctx.globalAlpha=a;ctx.fillStyle=b.color;
      ctx.fillRect(b.x,b.y,b.w,b.h);
      ctx.globalAlpha=.22;ctx.fillStyle='#fff';ctx.fillRect(b.x,b.y,b.w,3);
      ctx.globalAlpha=1;
      if(b.hp<3){ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(b.x+b.w*.35,b.y);ctx.lineTo(b.x+b.w*.55,b.y+b.h);ctx.stroke();}
    });
    // Paddle
    const py=H-PADDLE_H-12;
    const pg=ctx.createLinearGradient(paddle.x-paddle.w/2,0,paddle.x+paddle.w/2,0);
    pg.addColorStop(0,'#6366f1');pg.addColorStop(1,'#22d3ee');
    ctx.fillStyle=pg;ctx.beginPath();ctx.roundRect(paddle.x-paddle.w/2,py,paddle.w,PADDLE_H,5);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.3)';ctx.beginPath();ctx.roundRect(paddle.x-paddle.w/2+2,py+2,paddle.w-4,3,2);ctx.fill();
    // Ball with glow
    ctx.shadowColor='#22d3ee';ctx.shadowBlur=14;
    const bg=ctx.createRadialGradient(ball.x-1,ball.y-2,1,ball.x,ball.y,BALL_R);
    bg.addColorStop(0,'#fff');bg.addColorStop(1,'#22d3ee');
    ctx.fillStyle=bg;ctx.beginPath();ctx.arc(ball.x,ball.y,BALL_R,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    // Overlays
    if(waiting&&!gameover){
      ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#fff';ctx.font='bold 17px system-ui';ctx.textAlign='center';
      ctx.fillText(level===1?'Move mouse to start!':'Level '+level+' — move to launch.',W/2,H/2);
      ctx.textAlign='left';
    }
    if(gameover){
      ctx.fillStyle='rgba(0,0,0,.64)';ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#fff';ctx.font='bold 26px system-ui';ctx.textAlign='center';ctx.fillText('GAME OVER',W/2,H/2-20);
      ctx.font='15px system-ui';ctx.fillStyle='#22d3ee';ctx.fillText('Score: '+score+'  ·  Level '+level,W/2,H/2+8);
      ctx.font='12px system-ui';ctx.fillStyle='#8892a4';ctx.fillText('Click to restart',W/2,H/2+32);ctx.textAlign='left';
    }
  }

  body.querySelector('#bo-restart').addEventListener('click',()=>{reset();mouseX=null;running=true;});
  running=true;setTimeout(reset,80);
  reg(()=>{cancelAnimationFrame(frame);running=false;});
}

function triviaApp(body, reg){
  let pool=[...TRIVIA_Q].sort(()=>Math.random()-.5).slice(0,10);
  let qi=0,correct=0,timer,timeLeft,answered=false;

  function render(){
    if(qi>=pool.length){showResult();return;}
    const q=pool[qi],total=pool.length;
    body.innerHTML=`
    <div class="trivia-wrap">
      <div class="trivia-info">
        <span>Question ${qi+1} / ${total}</span>
        <span style="color:var(--green)">✓ ${correct}</span>
        <span style="color:var(--amber)" id="tv-timer">⏱ 15s</span>
      </div>
      <div class="trivia-timer-bar"><div class="trivia-timer-fill" id="tv-fill" style="width:100%"></div></div>
      <div class="trivia-q">${q.q}</div>
      <div class="trivia-opts">
        ${q.a.map((a,i)=>`<button class="t-opt" data-i="${i}">${String.fromCharCode(65+i)}. ${a}</button>`).join('')}
      </div>
    </div>`;
    answered=false;timeLeft=15;
    clearInterval(timer);
    timer=setInterval(()=>{
      timeLeft--;
      const el=body.querySelector('#tv-timer'),fill=body.querySelector('#tv-fill');
      if(el)el.textContent='⏱ '+timeLeft+'s';
      if(fill)fill.style.width=(timeLeft/15*100)+'%';
      if(timeLeft<=0){clearInterval(timer);if(!answered)nextQ();}
    },1000);
    body.querySelectorAll('.t-opt').forEach(btn=>{
      btn.addEventListener('click',()=>{
        if(answered)return;answered=true;clearInterval(timer);
        const i=parseInt(btn.dataset.i);
        btn.classList.add(i===q.c?'correct':'wrong');
        body.querySelectorAll('.t-opt')[q.c].classList.add('correct');
        if(i===q.c)correct++;
        setTimeout(()=>{qi++;render();},900);
      });
    });
  }

  function nextQ(){qi++;render();}

  function showResult(){
    body.innerHTML=`
    <div class="trivia-wrap" style="align-items:center;justify-content:center;text-align:center;">
      <div style="font-size:3rem">${correct>=8?'🏆':correct>=5?'⭐':'💡'}</div>
      <div style="font-size:1.3rem;font-weight:700;color:var(--text)">Quiz Complete!</div>
      <div style="font-size:2rem;color:var(--primary);font-weight:200">${correct} / ${pool.length}</div>
      <div style="color:var(--muted);font-size:.85rem">${correct>=8?'Outstanding!':correct>=5?'Not bad!':'Keep studying!'}</div>
      <button class="game-btn" style="margin-top:16px;padding:8px 22px" id="tv-again">🔄 Play Again</button>
    </div>`;
    body.querySelector('#tv-again').addEventListener('click',()=>{
      sfx.click();pool=[...TRIVIA_Q].sort(()=>Math.random()-.5).slice(0,10);qi=0;correct=0;render();
    });
  }

  reg(()=>clearInterval(timer));
  render();
}
